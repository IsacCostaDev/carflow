services:
  postgres:
    image: postgres:16-alpine
    container_name: carflow_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: carflow_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - carflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d carflow_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  carflow_pgdata:
